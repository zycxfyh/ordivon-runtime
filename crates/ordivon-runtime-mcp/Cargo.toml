[package]
name = "ordivon-runtime-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Loopback MCP adapter for the Ordivon trusted-local execution Runtime."
publish = false

[[bin]]
name = "ordivon-runtime"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true
ordivon-runtime-core = { version = "=0.1.0", path = "../ordivon-runtime-core" }
reqwest.workspace = true
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["net", "signal", "time"] }
tokio-util.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http.workspace = true
