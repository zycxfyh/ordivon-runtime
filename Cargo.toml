[workspace]
members = [
    "crates/ordivon-runtime-mcp",
    "crates/ordivon-runtime-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
rust-version = "1.95"
repository = "https://github.com/zycxfyh/ordivon-runtime"
homepage = "https://ordivon.com"

[workspace.dependencies]
axum = { version = "0.8", features = ["http1", "tokio"] }
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rmcp = { version = "=3.1.0", default-features = false, features = ["server", "macros"] }
rusqlite = { version = "=0.40.1", features = ["bundled", "backup"] }
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.7", features = ["limit"] }
uuid = { version = "=1.24.0", features = ["serde", "v7"] }
